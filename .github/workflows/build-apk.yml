name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and SDK Components
        run: |
          echo y | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} "platforms;android-34" "build-tools;35.0.0" "ndk;25.2.9519653"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install JS Dependencies
        run: bun install

      - name: Build Android APK
        run: |
          export NDK_HOME=${ANDROID_HOME}/ndk/25.2.9519653
          npx tauri android build --apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grind-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
